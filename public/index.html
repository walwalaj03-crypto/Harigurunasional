<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17132b">
  <meta name="description" content="Hitung mundur kejutan Hari Guru untuk Bu Elly Wandira dari Hendar.">
  <title>Something Special Is Coming — By Hendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:22px;color:#fff9f1;font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 18% 15%,#49305d 0,transparent 38%),radial-gradient(ellipse at 85% 80%,#342a58 0,transparent 42%),linear-gradient(145deg,#17132b,#21182f 55%,#17132b)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}
    .glow{position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(100px);opacity:.18;pointer-events:none}.one{background:#e99ab5;left:-150px;top:10%}.two{background:#9884e8;right:-150px;bottom:0}
    .wrap{width:min(720px,100%);text-align:center;position:relative;animation:appear 1s ease both}
    .brand{font-size:11px;letter-spacing:.25em;color:#f4d28a;font-weight:700}
    .flower{font-size:38px;margin:30px 0 16px;filter:drop-shadow(0 0 18px #f2a9bd66);animation:float 3s ease-in-out infinite}
    h1{font:600 clamp(38px,8vw,66px)/1.08 'Playfair Display',serif;margin:0}
    h1 span{display:block;color:#f4d28a;font-style:italic}
    .desc{color:#d7cde0;font-size:14px;line-height:1.8;margin:20px auto 35px;max-width:480px}
    .timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:590px;margin:auto}
    .unit{padding:23px 8px 19px;border:1px solid #ffffff27;border-radius:19px;background:linear-gradient(145deg,#ffffff15,#ffffff08);box-shadow:0 18px 55px #08061535;backdrop-filter:blur(10px)}
    .num{font:600 clamp(34px,8vw,56px)/1 'Playfair Display',serif;color:#fff4e5;font-variant-numeric:tabular-nums}
    .label{margin-top:12px;font-size:9px;letter-spacing:.2em;color:#d5c4df}
    .note{margin:27px 0 0;color:#f2a9bd;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
    .line{width:70px;height:1px;background:linear-gradient(90deg,transparent,#f4d28a,transparent);margin:25px auto}
    footer{margin-top:38px;color:#a99bb8;font-size:10px;letter-spacing:.18em}
    @keyframes appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{50%{transform:translateY(-8px) rotate(5deg)}}
    @media(max-width:480px){.timer{gap:7px}.unit{padding:19px 4px 15px;border-radius:14px}.label{font-size:8px;letter-spacing:.12em}.desc{font-size:13px;margin-bottom:28px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
  </style>
</head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <main class="wrap">
    <div class="brand">✦ A LITTLE SURPRISE BY HENDAR ✦</div>
    <div class="flower">🌷</div>
    <h1>Something <span>Special Is Coming</span></h1>
    <p class="desc">Ada sebuah pesan istimewa yang sedang menunggu untuk dibuka.<br>Untuk Bu Elly Wandira, dengan penuh rasa hormat. 🤍</p>
    <section class="timer" aria-label="Hitung mundur menuju Hari Guru">
      <div class="unit"><div class="num" id="days">00</div><div class="label">HARI</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">JAM</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">MENIT</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">DETIK</div></div>
    </section>
    <div class="note" id="note">Terbuka tepat 25 November · 00.00 WIB</div>
    <div class="line"></div>
    <footer>MADE WITH RESPECT & GRATITUDE · BY HENDAR</footer>
  </main>
  <script>
    // 25 November 2026 pukul 00.00 WIB (UTC+7)
    const target = new Date('2026-11-25T00:00:00+07:00').getTime();
    const pad = n => String(n).padStart(2, '0');
    function updateCountdown(){
      const distance = target - Date.now();
      if(distance <= 0){
        document.getElementById('note').textContent = 'Kejutan dibuka…';
        window.location.replace('/surat.html');
        return;
      }
      const days = Math.floor(distance / 86400000);
      const hours = Math.floor((distance % 86400000) / 3600000);
      const minutes = Math.floor((distance % 3600000) / 60000);
      const seconds = Math.floor((distance % 60000) / 1000);
      document.getElementById('days').textContent = pad(days);
      document.getElementById('hours').textContent = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);
    }
    updateCountdown();
    setInterval(updateCountdown, 250);
  </script>
</body>
</html>
